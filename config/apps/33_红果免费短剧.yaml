name: 红果免费短剧
package: com.phoenix.read
aliases:
- 红果免费短剧
- 红果短剧
- 红果
launch_reset: true   # 福利 tab 入口需从首页冷启动
intent_map:
  sign: sign
  watch: watch
  withdraw: withdraw
  collect: collect
behaviors:
  sign:
  # 2026-11-02 真机重校准（11.11 改版后全链重做）：
  # 旧链路「福利tab → 签到领金币[去签到] → 弹窗[重新签到]」已失效——App 改版，
  # 签到入口现为「日常福利 → 天天领金币 → 今日可领100 [领取]」。
  # 现场实测 2026-11-02：点[领取]后 累计金币收益 4651→4751(+100)、按钮变灰「今日已领」、
  # 变「明日7:00再领 105」→ 签到确认成功（终态凭据）。
  # 天天领金币页是 WebView（u2 看不到 领取/今日已领 文案），[领取]按钮靠视觉模板
  # btn_lingqu_tighter.png 命中 → 日志「视觉兜底点击成功」= 判定规则认可的点击凭据。
  - type: click_point
    x: 0.73
    y: 0.887
    timeout: 8
    optional: false
    vision: false
    desc: 底部「福利」tab（真机中心 (788,2075)）
    expect:
      # 福利页 vs 首页 整页 29 → 阈值 15（2026-11-02 重拍 ref_welfare 后裕度足）
      phash: images/红果免费短剧/landing/ref_welfare.png
      phash_max_dist: 15
      settle: 3.0
      retry: 1
  - type: think
  # 天天领金币[去领取]：坐标点击（盲点，非凭据；凭据在下一步[领取]模板）
  - type: click_point
    x: 0.828
    y: 0.578
    timeout: 8
    optional: false
    vision: false
    desc: 福利页「天天领金币」[去领取]（11-02 实测 (894,1352)）
  # 今日可领100 [领取]：x/y + 模板双配。模板命中（未签日橙色「领取」）→ 视觉兜底点击成功 = 点击凭据；
  # 已签日按钮变灰「今日已领」模板不中 → 坐标兜底 (0.819,0.349) 点灰色按钮 no-op，不报失败。
  # 判别精调（2026-11-02）：btn_lingqu_tighter 未签=1.0000 / 已签=0.7843（旧宽裁 已签=0.852 都>0.75 全局阈
  # → 已签日会误命中产出假凭据）。改用紧裁 + 本步 template_threshold=0.9：未签 1.0>0.9 命中（真凭据），
  # 已签 0.7843<0.9 不命中（走坐标 no-op，无凭据）。全局阈值保持 0.80 不动，仅此步覆盖。
  - type: click_point
    x: 0.819
    y: 0.349
    images:
    - images/红果免费短剧/btn_lingqu_tighter.png
    template_threshold: 0.9
    timeout: 8
    optional: false
    desc: 天天领金币「今日可领」领取（签到）
  watch:
  - type: any_of
    optional: true
    choices:
    - - type: click_first
        candidates:
        - type: text
          value: 赚钱
        - type: text
          value: 看剧赚钱
        - type: text
          value: 看视频得金币
        timeout: 8
        optional: false
    - - type: click_point
        vlm_prompt: 定位屏幕底部导航栏最右侧的『我的』标签中心
        x: 0.9
        y: 0.915
        optional: true
        vision: false
      - type: think
      - type: click_first
        candidates:
        - type: text
          value: 赚钱
        - type: text
          value: 看剧赚钱
        - type: text
          value: 看视频得金币
        timeout: 8
        optional: false
  - type: think
  - type: click_first
    candidates:
    - type: text
      value: 看剧
    - type: text
      value: 去完成
    - type: text
      value: 看短剧
    timeout: 6
    optional: true
  - type: swipe
    from:
    - 0.5
    - 0.7
    to:
    - 0.5
    - 0.3
    duration: 0.8
    natural: true
  - type: wait
    seconds: 3
  withdraw:
  - type: click_first
    candidates:
    - type: text
      value: 赚钱
    - type: text
      value: 我的
    - type: text
      value: 我
    timeout: 8
    optional: true
  - type: think
  - type: click_text
    text: 提现
    timeout: 6
    optional: true
  - type: reward
    pattern: (?P<amount>[0-9]+(?:\.[0-9]+)?)\s*(?P<unit>元)
    unit: 元
    name: 可提现余额
  - type: click_text
    text: 立即提现
    timeout: 6
    optional: true
  collect:
  - type: any_of
    optional: true
    choices:
    - - type: click_first
        candidates:
        - type: text
          value: 去领取
        - type: text
          value: 福利
        - type: text
          value: 任务中心
        - type: text
          value: 开宝箱
        timeout: 8
        optional: false
    - - type: click_point
        vlm_prompt: 定位屏幕底部导航栏最右侧的『我的』标签中心
        x: 0.9
        y: 0.915
        optional: true
        vision: false
      - type: think
      - type: click_first
        candidates:
        - type: text
          value: 去领取
        - type: text
          value: 福利
        - type: text
          value: 任务中心
        - type: text
          value: 开宝箱
        timeout: 8
        optional: false
  - type: think
  - type: click_first
    candidates:
    - type: text
      value: 领取
    - type: text
      value: 开
    timeout: 6
    optional: true
