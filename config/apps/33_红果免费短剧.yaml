name: 红果免费短剧
package: com.phoenix.read
aliases:
- 红果免费短剧
- 红果短剧
- 红果
launch_reset: true   # 福利 tab 入口需从首页冷启动
intent_map:
  sign: sign
  watch: watch
  withdraw: withdraw
  collect: collect
behaviors:
  sign:
  # 2026-11-02 真机重校准（11.11 改版后全链重做）：
  # 旧链路「福利tab → 签到领金币[去签到] → 弹窗[重新签到]」已失效——App 改版，
  # 签到入口现为「日常福利 → 天天领金币 → 今日可领100 [领取]」。
  # 现场实测 2026-11-02：点[领取]后 累计金币收益 4651→4751(+100)、按钮变灰「今日已领」、
  # 变「明日7:00再领 105」→ 签到确认成功（终态凭据）。
  # 天天领金币页是 WebView（u2 看不到 领取/今日已领 文案），[领取]按钮靠视觉模板
  # btn_lingqu_tighter.png 命中 → 日志「视觉兜底点击成功」= 判定规则认可的点击凭据。
  - type: click_point
    x: 0.73
    y: 0.887
    timeout: 8
    optional: false
    vision: false
    desc: 底部「福利」tab（真机中心 (788,2075)）
    expect:
      # 福利页 vs 首页 整页 29 → 阈值 15（2026-11-02 重拍 ref_welfare 后裕度足）
      phash: images/红果免费短剧/landing/ref_welfare.png
      phash_max_dist: 15
      settle: 3.0
      retry: 1
  - type: think
  # 2026-11-04 未签态重抓（AUTOP-2026-11-04-真机族 任务1，§5.16）：11.11 二次改版后
  # 签到真身 = 「今日签到领N金币」弹窗（今日=1888/已连续签到2天，7日日历
  # 88/2928/1888/???/???/???/6088）。[立即签到 +1888 金币] 实测中心 (548,1429)。
  # 11-02 的「天天领金币[去领取]→[领取]」链已彻底失效（11-03 晨证实
  # (0.828,0.578) 现命中「饭点领金币补贴」）。
  #
  # 弹窗出现路径有两条（2026-11-04 实测）：
  #   ① 每日首次进福利页**自动弹出**（有频控：当日二进不再弹，08:24 取证已消耗首弹，
  #      08:27 首跑实测二进无弹窗 orange_ratio 0.086≈基线）；
  #   ② 福利页「日常福利 → 签到领金币1888 [去签到]」手动入口 (921,1316)，随时可点。
  # 故先盲点[去签到]兜底开弹窗（自动弹窗已在时该点落在弹窗卡内空白区，无害），
  # 再以模板点[立即签到]——模板命中点击=唯一凭据点；已签日弹窗不复现/按钮变灰
  # → 模板不中诚实跳过，无凭据不报 confirmed（判定走 sign_evidence）。
  - type: click_point
    x: 0.853
    y: 0.562
    timeout: 6
    optional: true
    vision: false
    desc: 福利页「签到领金币」[去签到]手动入口（2026-11-04 实测 (921,1316)；兜底开签到弹窗）
  - type: think
  - type: click_point
    images:
    - images/红果免费短剧/btn_liji_sign.png
    template_threshold: 0.9
    timeout: 10
    optional: true
    desc: 签到弹窗[立即签到 +N金币]（2026-11-04 未签态真身 (548,1429)；离线校验：弹窗页 0.9933 / 无弹窗福利页 0.424，阈 0.9 区分度足）
  watch:
  - type: any_of
    optional: true
    choices:
    - - type: click_first
        candidates:
        - type: text
          value: 赚钱
        - type: text
          value: 看剧赚钱
        - type: text
          value: 看视频得金币
        timeout: 8
        optional: false
    - - type: click_point
        vlm_prompt: 定位屏幕底部导航栏最右侧的『我的』标签中心
        x: 0.9
        y: 0.915
        optional: true
        vision: false
      - type: think
      - type: click_first
        candidates:
        - type: text
          value: 赚钱
        - type: text
          value: 看剧赚钱
        - type: text
          value: 看视频得金币
        timeout: 8
        optional: false
  - type: think
  - type: click_first
    candidates:
    - type: text
      value: 看剧
    - type: text
      value: 去完成
    - type: text
      value: 看短剧
    timeout: 6
    optional: true
  - type: swipe
    from:
    - 0.5
    - 0.7
    to:
    - 0.5
    - 0.3
    duration: 0.8
    natural: true
  - type: wait
    seconds: 3
  withdraw:
  - type: click_first
    candidates:
    - type: text
      value: 赚钱
    - type: text
      value: 我的
    - type: text
      value: 我
    timeout: 8
    optional: true
  - type: think
  - type: click_text
    text: 提现
    timeout: 6
    optional: true
  - type: reward
    pattern: (?P<amount>[0-9]+(?:\.[0-9]+)?)\s*(?P<unit>元)
    unit: 元
    name: 可提现余额
  - type: click_text
    text: 立即提现
    timeout: 6
    optional: true
  collect:
  - type: any_of
    optional: true
    choices:
    - - type: click_first
        candidates:
        - type: text
          value: 去领取
        - type: text
          value: 福利
        - type: text
          value: 任务中心
        - type: text
          value: 开宝箱
        timeout: 8
        optional: false
    - - type: click_point
        vlm_prompt: 定位屏幕底部导航栏最右侧的『我的』标签中心
        x: 0.9
        y: 0.915
        optional: true
        vision: false
      - type: think
      - type: click_first
        candidates:
        - type: text
          value: 去领取
        - type: text
          value: 福利
        - type: text
          value: 任务中心
        - type: text
          value: 开宝箱
        timeout: 8
        optional: false
  - type: think
  - type: click_first
    candidates:
    - type: text
      value: 领取
    - type: text
      value: 开
    timeout: 6
    optional: true
