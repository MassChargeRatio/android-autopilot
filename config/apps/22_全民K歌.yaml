name: 全民K歌
package: com.tencent.karaoke
aliases:
- 全民K歌
- K歌
intent_map:
  collect: collect
  bonus: bonus
behaviors:
  collect:
  # 2026-11-03 实机复查：任务中心=WebView/H5，`领取/天天签到/任务` 文本**不在可及树**
  # （dump 仅 76 节点；惊喜1K币「领取」点击→全屏广告京东保，看15s得奖励）。
  # → 文本链第二步（领取）找不到，collect 失效。待专项：视觉/坐标定位或改手工。
  # 入口仍可达：desc「任务中心」@[66,129][150,213]（clickable=false ImageView，u2 desc 点击可进）。
  - type: click_first
    candidates:
    - type: text
      value: 任务中心
    - type: desc
      value: 任务中心
    - type: text
      value: 福利
    - type: text
      value: 每日任务
    - type: text
      value: 做任务
    timeout: 8
    optional: true
  - type: think
  - type: click_first
    candidates:
    - type: text
      value: 领取
    - type: text
      value: 去完成
    timeout: 6
    optional: true
  bonus:
  - type: click_first
    candidates:
    - type: text
      value: 红包
    - type: text
      value: 领红包
    - type: text
      value: 抽奖
    timeout: 8
    optional: true
  - type: think
  - type: click_first
    candidates:
    - type: text
      value: 立即领取
    - type: text
      value: 领取
    timeout: 6
    optional: true
