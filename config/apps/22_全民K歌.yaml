name: 全民K歌
package: com.tencent.karaoke
aliases:
- 全民K歌
- K歌
intent_map:
  sign: sign
  collect: collect
  bonus: bonus
behaviors:
  sign:
  # 2026-11-04 实机验证（族W 复核）：冷启动自动弹「天天签到 最高300K币」弹窗，
  # [立即签到] 实测 (367,1673)，点击 → 跳任务中心入账 **+288 K币（12028→12316）**
  # = 终态凭据。弹窗自动出现有时序（当日首次概率高）；不在时该步 optional 落空
  # （盲点落动态页内容，随后复位逻辑会修正，迄今无害）。
  # ⚠️ 任务中心[天天签到]入口的「开红包」角标会拉起 15 秒激励广告陷阱（京东保），
  # 退出须点「放弃奖励」——不要把该入口配进链路。
  - type: click_point
    x: 0.34
    y: 0.715
    images:
    - images/全民K歌/btn_liji_sign.png
    timeout: 8
    optional: true
    desc: 天天签到弹窗[立即签到]（2026-11-04 实测 (367,1673)，冷启动自动弹出；模板自匹配 1.0）
    expect:
      # 点击后跳任务中心（2026-11-04 实测落点；K币余额页 H5，任务中心标题在树）
      text_any: [任务中心]
      settle: 3.0
  - type: think
  collect:
  # 2026-11-03 实机复查：任务中心=WebView/H5，`领取/天天签到/任务` 文本**不在可及树**
  # （dump 仅 76 节点；惊喜1K币「领取」点击→全屏广告京东保，看15s得奖励）。
  # → 文本链第二步（领取）找不到，collect 失效。待专项：视觉/坐标定位或改手工。
  # 入口仍可达：desc「任务中心」@[66,129][150,213]（clickable=false ImageView，u2 desc 点击可进）。
  - type: click_first
    candidates:
    - type: text
      value: 任务中心
    - type: desc
      value: 任务中心
    - type: text
      value: 福利
    - type: text
      value: 每日任务
    - type: text
      value: 做任务
    timeout: 8
    optional: true
  - type: think
  - type: click_first
    candidates:
    - type: text
      value: 领取
    - type: text
      value: 去完成
    timeout: 6
    optional: true
  bonus:
  - type: click_first
    candidates:
    - type: text
      value: 红包
    - type: text
      value: 领红包
    - type: text
      value: 抽奖
    timeout: 8
    optional: true
  - type: think
  - type: click_first
    candidates:
    - type: text
      value: 立即领取
    - type: text
      value: 领取
    timeout: 6
    optional: true
