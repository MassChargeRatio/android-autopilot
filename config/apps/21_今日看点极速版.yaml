name: 今日看点极速版
package: com.jinrikd.news
aliases:
- 今日看点极速版
- 今日看点
intent_map:
  sign: sign
  watch: watch
  withdraw: withdraw
behaviors:
  sign:
  - type: any_of
    optional: true
    choices:
    - - type: click_first
        candidates:
        - type: text
          value: 直接领取
        - type: text
          value: 签到
        - type: text
          value: 立即签到
        - type: text
          value: 每日签到
        timeout: 8
        optional: false
    - - type: click_point
        vlm_prompt: 定位屏幕底部导航栏最右侧的『我的』标签中心
        x: 0.9
        y: 0.915
        optional: true
        vision: false
      - type: think
      - type: click_first
        candidates:
        - type: text
          value: 直接领取
        - type: text
          value: 签到
        - type: text
          value: 立即签到
        - type: text
          value: 每日签到
        timeout: 8
        optional: false
  - type: think
  - type: reward
    pattern: 直接领取(?P<amount>[0-9]+)\s*(?P<unit>金币)
    unit: 金币
    name: 签到奖励
  - type: click_first
    candidates:
    - type: text
      value: 直接领取322金币
    - type: text
      value: 领取
    timeout: 6
    optional: true
  watch:
  - type: any_of
    optional: true
    choices:
    - - type: click_first
        candidates:
        - type: text
          value: 看视频
        - type: text
          value: 看视频赚钱
        - type: text
          value: 任务中心
        - type: text
          value: 金币
        timeout: 8
        optional: false
    - - type: click_point
        vlm_prompt: 定位屏幕底部导航栏最右侧的『我的』标签中心
        x: 0.9
        y: 0.915
        optional: true
        vision: false
      - type: think
      - type: click_first
        candidates:
        - type: text
          value: 看视频
        - type: text
          value: 看视频赚钱
        - type: text
          value: 任务中心
        - type: text
          value: 金币
        timeout: 8
        optional: false
  - type: think
  - type: click_first
    candidates:
    - type: text
      value: 看视频领金币
    - type: text
      value: 去完成
    - type: text
      value: 领金币
    timeout: 6
    optional: true
  - type: swipe
    from:
    - 0.5
    - 0.7
    to:
    - 0.5
    - 0.3
    duration: 0.8
    natural: true
  - type: wait
    seconds: 3
  withdraw:
  - type: any_of
    optional: true
    choices:
    - - type: click_first
        candidates:
        - type: text
          value: 我的
        - type: text
          value: 我
        timeout: 8
        optional: false
    - - type: click_point
        vlm_prompt: 定位屏幕底部导航栏最右侧的『我的』标签中心
        x: 0.9
        y: 0.915
        optional: true
        vision: false
      - type: think
      - type: click_first
        candidates:
        - type: text
          value: 我的
        - type: text
          value: 我
        timeout: 8
        optional: false
  - type: think
  - type: click_text
    text: 提现
    timeout: 6
    optional: true
  - type: reward
    pattern: (?P<amount>[0-9]+(?:\.[0-9]+)?)\s*(?P<unit>元)
    unit: 元
    name: 可提现余额
  - type: click_text
    text: 立即提现
    timeout: 6
    optional: true
