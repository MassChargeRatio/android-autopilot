name: 趣头条
package: com.jifen.qukan
aliases:
- 趣头条
- 趣看天下
- 趣闻
- 新闻赚金币
intent_map:
  sign: sign
  watch: watch
  withdraw: withdraw
behaviors:
  sign:
  # 【用户人工描述 2026-10-20】需关好几个弹窗才进正式界面；底部5按钮右下=我的、右二=任务；任务界面中部最左=今日签到
  # 多轮弹窗清扫（F1 dismiss_popups 上线后由全局清扫接管，此处为过渡手写版）
  - type: any_of
    optional: true
    choices:
    - - type: click_first
        candidates:
        - type: text
          value: 暂不
        - type: text
          value: 关闭
        - type: text
          value: 以后再说
        - type: text
          value: 稍后再说
        - type: text
          value: 我知道了
        - type: text
          value: 知道了
        - type: text
          value: 不再提醒
        - type: text
          value: 取消
        timeout: 3
  - type: any_of
    optional: true
    choices:
    - - type: click_first
        candidates:
        - type: text
          value: 暂不
        - type: text
          value: 关闭
        - type: text
          value: 以后再说
        - type: text
          value: 我知道了
        - type: text
          value: 知道了
        timeout: 3
  # 底部右二 tab「任务」
  - type: any_of
    optional: true
    choices:
    - - type: click_first
        candidates:
        - type: text
          value: 任务
        candidates_from: nav_tab
        zone: tab_zone
        timeout: 8
        optional: false
    - - type: click_point
        x: 0.7
        y: 0.914
        timeout: 8
        optional: false
        vision: false
        desc: 底部右二tab「任务」坐标兜底（待真机校准）
  - type: think
  # 任务界面中部最左「今日签到」——纯词表自搜寻（全局 SIGN 前缀同序）
  - type: any_of
    optional: true
    choices:
    - - type: click_first
        candidates_from: sign
        timeout: 8
        optional: false
    - - type: click_point
        x: 0.16
        y: 0.45
        timeout: 8
        optional: false
        vision: false
        desc: 任务界面中部最左「今日签到」坐标兜底（待真机校准）
  watch:
  - type: click_first
    candidates:
    - type: text
      value: 看视频领金币
    - type: text
      value: 体验领金币
    - type: text
      value: 领50金币
    - type: text
      value: 视频
    timeout: 8
    optional: true
  - type: think
  - type: reward
    pattern: 看视频[^0-9]*(?P<amount>[0-9]+)\s*(?P<unit>金币)
    unit: 金币
    name: 看视频
  - type: reward
    pattern: \+\s*(?P<amount>[0-9]+)\s*(?P<unit>金币)
    unit: 金币
    name: 看视频加奖
  - type: swipe
    from:
    - 0.5
    - 0.7
    to:
    - 0.5
    - 0.3
    duration: 0.8
    natural: true
  - type: wait
    seconds: 3
  withdraw:
  - type: click_text
    text: 我的
    timeout: 8
  - type: think
  - type: click_text
    text: 提现兑换
    timeout: 6
  - type: ensure
    text: 我要提现
    exists: 'yes'
    timeout: 5
  - type: reward
    pattern: 约(?P<amount>[0-9]+(?:\.[0-9]+)?)\s*(?P<unit>元)
    unit: 元
    name: 可提现余额
  - type: click_text
    text: 立即提现
    timeout: 6
    optional: true
