name: 星图金融
package: com.suning.mobile.epa
aliases:
- 星图金融
- 苏宁金融
intent_map:
  collect: collect
  bonus: bonus
  sign: sign
behaviors:
  sign:
  # 1) 首页「早起打卡」入口（第3排左1，节点 clickable=false 需坐标兜底）@(36,1189)-(236,1282)
  - type: any_of
    optional: true
    choices:
    - - type: click_first
        candidates:
        - type: text
          value: 早起打卡
        timeout: 8
        optional: false
    - - type: click_point
        x: 0.126
        y: 0.527
        timeout: 8
        optional: false
        vision: false
  # 2) H5 打卡页加载等待
  - type: wait
    seconds: 3
  # 3) 打卡按钮：未打卡文案「打卡」/「立即打卡」；已打卡变「打卡倒计时」不误点
  #    按钮区 (264,1386)-(816,1551)；标签中心 (540,1468) 上半部被透明层遮挡点不动，
  #    实测有效点 (540,1500) -> (0.5, 0.641)
  - type: click_first
    candidates:
    - type: text
      value: 立即打卡
    - type: text
      value: 我要打卡
    - type: text
      value: 打卡
    timeout: 8
    optional: true
  - type: click_point
    x: 0.5
    y: 0.641
    timeout: 5
    optional: true
    vision: false
  - type: think
  collect:
  - type: click_first
    candidates:
    - type: text
      value: 迎新福利
    - type: text
      value: 人人领
    - type: text
      value: 任务中心
    - type: text
      value: 领好礼
    - type: text
      value: 任务
    timeout: 8
    optional: true
  - type: think
  - type: click_text
    text: 立即领取
    timeout: 6
    optional: true
  bonus:
  - type: click_first
    candidates:
    - type: text
      value: 领红包
    - type: text
      value: 红包
    - type: text
      value: 现金红包
    - type: text
      value: 抽奖
    timeout: 8
    optional: true
  - type: think
  - type: click_text
    text: 立即领取
    timeout: 6
    optional: true
  - type: wait
    seconds: 2
