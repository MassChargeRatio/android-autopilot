name: 一淘
package: com.taobao.etao
aliases:
- 一淘
launch_reset: true   # 2026-11-02：复位重启需冷启动回首页（否则恢复脏子页，领取/领金币候选未出现）
intent_map:
  sign: sign
  watch: watch
  withdraw: withdraw
behaviors:
  sign:
  - type: any_of
    optional: true
    choices:
    - - type: click_first
        candidates:
        - type: text
          value: 签到
        - type: desc
          value: 签到
        - type: text
          value: 每日签到
        - type: text
          value: 立即签到
        - type: text
          value: 天天领
        timeout: 8
        optional: false
    - - type: click_point
        vlm_prompt: 定位屏幕底部导航栏最右侧的『我的』标签中心
        x: 0.9
        y: 0.915
        optional: true
        vision: false
      - type: think
      - type: click_first
        candidates:
        - type: text
          value: 签到
        - type: desc
          value: 签到
        - type: text
          value: 每日签到
        - type: text
          value: 立即签到
        - type: text
          value: 天天领
        timeout: 8
        optional: false
  - type: think
  - type: click_first
    candidates:
    - type: text
      value: 领取
    - type: text
      value: 领金币
    timeout: 6
    optional: true
  watch:
  - type: any_of
    optional: true
    choices:
    - - type: click_first
        candidates:
        - type: text
          value: 去福狸中心做任务
        - type: text
          value: 看视频领金币
        - type: text
          value: 任务中心
        - type: text
          value: 省金币
        - type: text
          value: 今日任务
        timeout: 8
        optional: false
    - - type: click_point
        vlm_prompt: 定位屏幕底部导航栏最右侧的『我的』标签中心
        x: 0.9
        y: 0.915
        optional: true
        vision: false
      - type: think
      - type: click_first
        candidates:
        - type: text
          value: 去福狸中心做任务
        - type: text
          value: 看视频领金币
        - type: text
          value: 任务中心
        - type: text
          value: 省金币
        - type: text
          value: 今日任务
        timeout: 8
        optional: false
  - type: think
  - type: click_first
    candidates:
    - type: text
      value: 看视频
    - type: text
      value: 领
    - type: text
      value: 去完成
    timeout: 6
    optional: true
  - type: swipe
    from:
    - 0.5
    - 0.7
    to:
    - 0.5
    - 0.3
    duration: 0.8
    natural: true
  - type: wait
    seconds: 3
  withdraw:
  - type: any_of
    optional: true
    choices:
    - - type: click_first
        candidates:
        - type: text
          value: 我的
        - type: text
          value: 我
        timeout: 8
        optional: false
    - - type: click_point
        vlm_prompt: 定位屏幕底部导航栏最右侧的『我的』标签中心
        x: 0.9
        y: 0.915
        optional: true
        vision: false
      - type: think
      - type: click_first
        candidates:
        - type: text
          value: 我的
        - type: text
          value: 我
        timeout: 8
        optional: false
  - type: think
  - type: click_text
    text: 提现
    timeout: 6
    optional: true
  - type: reward
    pattern: 可提现(?P<amount>[0-9]+(?:\.[0-9]+)?)\s*(?P<unit>元)
    unit: 元
    name: 可提现余额
  - type: click_text
    text: 立即提现
    timeout: 6
    optional: true
