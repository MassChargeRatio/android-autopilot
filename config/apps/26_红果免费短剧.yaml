name: 红果免费短剧
package: com.phoenix.read
aliases:
- 红果免费短剧
- 红果短剧
- 红果
launch_reset: true   # 福利 tab 入口需从首页冷启动
intent_map:
  sign: sign
  watch: watch
  withdraw: withdraw
  collect: collect
behaviors:
  sign:
  # 2026-10-24 真机重校准。旧链路「我的 tab → 找签到」必失败：
  # 签到不在「我的」页，而是底部 **福利 tab**（tab 上的「签到」只是角标，
  # 且该角标浮在视频上，点它会误进剧集详情页 —— 实测踩过）。
  # 底部 tab 实为：首页 / 剧场 / 商城 / **福利** / 我的。
  # 真实链路：福利 tab (788,2075) → 「日常福利·签到领金币」[去签到] (864,1370)
  #      → 弹窗 [重新签到] (270,1434)。
  # 实测 2026-10-24：已连续签到 1 天，明日可领 428 金币。
  # 注意：与今日头条极速版同形态弹窗，但红果**响应注入点击**（头条不响应）。
  - type: click_point
    x: 0.73
    y: 0.887
    timeout: 8
    optional: false
    vision: false
    desc: 底部「福利」tab（真机中心 (788,2075)）
    expect:
      # 福利页 vs 首页 整页 29 → 阈值 12
      phash: images/红果免费短剧/landing/ref_welfare.png
      phash_max_dist: 12
      settle: 3.0
      retry: 1
  - type: think
  - type: click_point
    x: 0.8
    y: 0.585
    images:
    - images/红果免费短剧/btn_qiandao.png
    timeout: 8
    optional: false
    desc: 福利页「签到领金币」[去签到]（真机中心 (864,1370)）
    expect:
      # 只比弹窗白卡区(0.30-0.55)：签前/签后差 1，福利页差 23 → 阈值 10
      phash: images/红果免费短剧/landing/ref_dialog.png
      phash_region: [0.0, 0.30, 1.0, 0.55]
      phash_max_dist: 10
      settle: 3.0
      retry: 1
  # 弹窗 [重新签到]（不走「看视频立即续签」）
  - type: click_point
    x: 0.25
    y: 0.613
    timeout: 8
    optional: true
    vision: false
    desc: 签到弹窗[重新签到]（真机中心 (270,1434)）
  watch:
  - type: any_of
    optional: true
    choices:
    - - type: click_first
        candidates:
        - type: text
          value: 赚钱
        - type: text
          value: 看剧赚钱
        - type: text
          value: 看视频得金币
        timeout: 8
        optional: false
    - - type: click_point
        vlm_prompt: 定位屏幕底部导航栏最右侧的『我的』标签中心
        x: 0.9
        y: 0.915
        optional: true
        vision: false
      - type: think
      - type: click_first
        candidates:
        - type: text
          value: 赚钱
        - type: text
          value: 看剧赚钱
        - type: text
          value: 看视频得金币
        timeout: 8
        optional: false
  - type: think
  - type: click_first
    candidates:
    - type: text
      value: 看剧
    - type: text
      value: 去完成
    - type: text
      value: 看短剧
    timeout: 6
    optional: true
  - type: swipe
    from:
    - 0.5
    - 0.7
    to:
    - 0.5
    - 0.3
    duration: 0.8
    natural: true
  - type: wait
    seconds: 3
  withdraw:
  - type: click_first
    candidates:
    - type: text
      value: 赚钱
    - type: text
      value: 我的
    - type: text
      value: 我
    timeout: 8
    optional: true
  - type: think
  - type: click_text
    text: 提现
    timeout: 6
    optional: true
  - type: reward
    pattern: (?P<amount>[0-9]+(?:\.[0-9]+)?)\s*(?P<unit>元)
    unit: 元
    name: 可提现余额
  - type: click_text
    text: 立即提现
    timeout: 6
    optional: true
  collect:
  - type: any_of
    optional: true
    choices:
    - - type: click_first
        candidates:
        - type: text
          value: 去领取
        - type: text
          value: 福利
        - type: text
          value: 任务中心
        - type: text
          value: 开宝箱
        timeout: 8
        optional: false
    - - type: click_point
        vlm_prompt: 定位屏幕底部导航栏最右侧的『我的』标签中心
        x: 0.9
        y: 0.915
        optional: true
        vision: false
      - type: think
      - type: click_first
        candidates:
        - type: text
          value: 去领取
        - type: text
          value: 福利
        - type: text
          value: 任务中心
        - type: text
          value: 开宝箱
        timeout: 8
        optional: false
  - type: think
  - type: click_first
    candidates:
    - type: text
      value: 领取
    - type: text
      value: 开
    timeout: 6
    optional: true
