name: 快手
package: com.smile.gifmaker
launch_reset: true   # 2026-10-30 真机实证：不冷启动会恢复上次停留的「用户主页」，首页左上角☰点空（点到头像）
popups:
  # 2026-10-30 真机实测：进任务中心会自弹「瓜分百亿金币」，没有可点文案/id，
  # 关闭 X 在 (983,456) = 归一化 (0.910, 0.195)。全局 corner (0.93,0.11) 打不中。
  close_points:
  - x: 0.910
    y: 0.195
    desc: 任务中心「瓜分百亿金币」弹窗关闭X（真机 (983,456)）
aliases:
- 快手
behaviors:
  bonus:
  - type: click_point
    images:
    - images/快手/e65cea03-918e-4297-9f92-b5eef52e88f3.png
    timeout: 6
    optional: true
    desc: 图像-快手-任务界面-红包图标
  - type: click_point
    images:
    - images/快手/150f0fd5-b06e-4eaa-af57-0245d629ed0e.png
    timeout: 6
    optional: true
    desc: 图像-快手-点宝箱-点可领
  - type: click_point
    images:
    - images/快手/c00e3080-8b4c-46aa-8478-74abc3a5a73f.png
    timeout: 6
    optional: true
    desc: 图像-快手-点宝箱-关闭
  sign:
  # 2026-10-24 真机重校准。旧链路：☰侧边栏 → 任务中心 → scroll_to「签到」。
  # 但任务中心是 H5 页面（dump 仅 17 节点、无任何文案），scroll_to text=签到 永远失败。
  # 真实链路：☰(76,140) → 侧边栏右侧「任务中心」磁贴(689,376)
  #      → 「连续签到14天得0.4元」行 [立即签到](924,793) → 弹窗 [立即签到](540,1480)。
  # 实测 2026-10-24 已连签 5/14 → 6/14 成功，明日可领 688 金币。
  - type: click_point
    x: 0.072
    y: 0.0645
    timeout: 6
    optional: false
    vision: false
    desc: 首页左上角☰打开侧边栏（2026-10-30 真机校准：旧值 0.07/0.06=(76,140) 落在图标上沿点空，实测中心 (78,151)）
  - type: think
  - type: any_of
    optional: false
    choices:
    - - type: click_first
        candidates:
        - type: desc
          value: 任务中心
        - type: text
          value: 任务中心
        timeout: 8
        optional: false
    - - type: click_point
        x: 0.638
        y: 0.161
        timeout: 8
        optional: false
        vision: false
        desc: 侧边栏「任务中心」磁贴（真机中心 (689,376)，旧值 0.5/0.18 偏左错过）
        expect:
          phash: images/快手/landing/ref_task.png
          phash_max_dist: 8
          settle: 3.0
          retry: 1
  - type: think
  # 任务中心「连续签到14天得0.4元」行的 [立即签到]
  - type: click_point
    x: 0.856
    y: 0.339
    timeout: 6
    optional: false
    vision: false
    desc: 任务中心[立即签到]（真机中心 (924,793)）
    expect:
      # 弹窗内容会变（288→688、今日→明日），整页前后差 7，故阈值放宽到 10；
      # 弹窗 vs 任务页 30，仍有干净间隔。
      phash: images/快手/landing/ref_dialog.png
      phash_max_dist: 10
      settle: 3.0
      # 2026-10-30：retry 1→0。这张基准图是「签到前」弹窗，签到成功后内容必变、
      # 距离实测 23~27 必然失配，再点一次注定还是失配——一次无效重试 13s。
      retry: 0
  # 弹窗内 [立即签到]：点完 288 金币入账、连签 5/14 → 6/14
  - type: click_point
    x: 0.5
    y: 0.632
    timeout: 6
    optional: true
    vision: false
    desc: 签到弹窗[立即签到]（真机中心 (540,1480)）
  - type: reward
    pattern: 今日签到可领\s*(?P<amount>[0-9]+)\s*(?P<unit>金币)
    unit: 金币
    name: 签到金币
  withdraw:
  - type: click_point
    images:
    - images/快手/f1ab7643-c156-4612-ae98-8fb425475b29.png
    timeout: 6
    optional: true
    desc: 图像-快手-提现-领现金
  - type: click_point
    images:
    - images/快手/9e4c2242-f684-4574-afdc-e7df073e5363.png
    timeout: 6
    optional: true
    desc: 图像-快手-提现-立即兑换
  - type: click_point
    images:
    - images/快手/77b164cc-12ca-410f-a0e4-ae9f48460d91.png
    timeout: 6
    optional: true
    desc: 图像-快手-提现-立即提现
  collect:
  - type: click_point
    images:
    - images/快手/0100ec21-8be7-4552-b456-e20e7f831f39.png
    timeout: 6
    optional: true
    desc: 图像-快手-任务列表-关闭
  # 2026-10-25 整理：原中文 behavior 名「白拿礼物」收编为标准意图名 gift
  # （NLU 侧已注册 gift 关键词：白拿礼物/白拿/免费领/领礼物）。
  # 中文 behavior 名无法被任何标准意图命中，只能靠 intent_map 手写映射。
  gift:
  - type: click_point
    images:
    - images/快手/dc7e72b7-ba53-4572-aafa-052262c440d3.png
    timeout: 6
    optional: true
    desc: 图像-快手-白拿礼物-去领取
