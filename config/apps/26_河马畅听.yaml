name: 河马畅听
package: com.hm.hmysct
aliases:
- 河马畅听
launch_reset: true   # 签到入口在首页固定位置，需冷启动
behaviors:
  sign:
  # 2026-11-03 实机复查：签到入口已随 11.11 改版**移除**——首页=听书feed（无签到卡）、
  # 领现金页=浏览赚现金/听书可提现/惊喜专区(下载任务)/听书赚金币（无每日签到）、
  # 我的页=金币/余额/收听历史（无签到）。「下载并进行签到」是**下载推广任务**非本app签到。
  # → 下方链路诚实报「未完成」（非假成功）。若后续版本恢复入口，按旧校准改回。
  # 历史(2026-10-24)：签到在首页「连续七天签到 领大额金币」卡，按钮「立即签到得2288金币」
  # （[198,1490][882,1640]），落地校验用弹窗文案「100%中奖 / 无套路」。
  - type: click_first
    candidates:
    - type: text
      value: 立即签到
    - type: text
      value: 签到领取
    timeout: 8
    optional: false
    expect:
      text_any: [100%中奖, 无套路]
      retry: 1
      settle: 2.5
  - type: reward
    pattern: 立即签到得(?P<amount>[0-9]+)\s*(?P<unit>金币)
    unit: 金币
    name: 签到金币
  open:
  - type: click_point
    images:
    - images/海马畅听/a1b7fef3-462b-4e39-bfb9-2722764499ab.png
    timeout: 6
    optional: true
    desc: 图像-海马畅听-打开APP-分类按钮
  bonus:
  - type: click_id
    res_id: com.hm.hmysct:id/llBottom
    timeout: 6
    optional: true
    desc: 文本框-海马畅听-任务列表-领现金
