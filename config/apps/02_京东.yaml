name: 京东
package: com.jingdong.app.mall
aliases:
- 京东
launch_reset: true   # 逛 tab 入口需从首页冷启动
behaviors:
  sign:
  # 2026-11-04 真机重校准（用户指正「['赚现金','领金币'] 只是入口，签到未完成」）：
  # 旧配置两处过时/错误 ——
  #   1) 假设「逛 tab 会自动弹金币面板」不成立：2026-11-04 实测逛页为**全屏短视频**
  #      形态，金币面板需**手动点「赚现金」胶囊**才弹出（非自动）。
  #   2) 签到领坐标 (259,1008) 错：面板「连续签到7天」的当日[签到领] 按钮在
  #      第6天槽位，实测中心 **(780,1047)**（左侧是打勾区，非按钮）。
  #   3) 模板 images/京东/btn_qiandao.png 实为「最高1元」角标（130x80），不是
  #      签到领按钮，已废弃。
  # 真实链路（2026-11-04 19:1x 实测并人工验证签到成功：第6天✓、第7天「明日可领」、
  # 现金 19.58→19.60）：逛 tab → 点「赚现金」胶囊弹面板 → 点当日[签到领] (780,1047)。
  # 注意：金币面板是自定义浮层，**不在 accessibility 树**（uiautomator dump 拿不到
  # 「签到领/连续签到7天」文本），无法用 text_nodes 落地校验，只能坐标/视觉。
  - type: click_point
    x: 0.306
    y: 0.900
    timeout: 8
    optional: false
    vision: false
    desc: 底部「逛」tab（首页与消息之间；真机中心 (330,2105)）
    expect:
      text_any: [赚现金, 领金币]
      settle: 3.0
      retry: 1
  - type: think
  # 2026-11-04 新增：手动弹金币面板（旧配置无此步，误以为逛页自动弹）。
  - type: click_point
    x: 0.907
    y: 0.247
    timeout: 8
    optional: true
    vision: false
    desc: 逛页右侧「赚现金」胶囊（真机中心 (980,577)；点击弹出金币面板）
  - type: think
  - type: click_point
    x: 0.722
    y: 0.447
    timeout: 8
    optional: true
    vision: false
    desc: 金币面板「连续签到7天」当日[签到领]（2026-11-04 实测第6天槽位中心 (780,1047)；已签到日该按钮不出现，optional 跳过）
  withdraw:
  - type: click_point
    images:
    - images/京东/dc8480ee-0d96-4ae4-880a-894ae13d9ee4.png
    timeout: 6
    optional: true
    desc: 图像-京东-提现-提现至京东钱包
  - type: click_point
    images:
    - images/京东/3c265ddf-12c5-4858-8f71-65c17d98886b.png
    timeout: 6
    optional: true
    desc: 图像-京东-提现-可提现
  - type: click_point
    images:
    - images/京东/b0280879-92dd-4bd9-920c-ec465e0e39e8.png
    timeout: 6
    optional: true
    desc: 图像-京东-提现-提现至钱包
  collect:
