    images:
    - images/京东/83342289-5e5c-4765-93f3-1b5446f742be.png
    timeout: 6
    optional: true
    desc: 图像-京东-任务界面-赚现金
  - type: click_point
    images:
    - images/京东/043972e5-c653-418b-ad5e-cdfd357ab366.png
    timeout: 6
    optional: true
    desc: 图像-京东-任务界面-京东图标
  - type: click_point
