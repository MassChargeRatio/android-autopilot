name: 快手极速版
package: com.kuaishou.nebula
launch_reset: true
popups:
  close_points:
  - x: 0.938
    y: 0.15
    desc: 任务中心「大奖免费拿」弹窗关闭X（真机 (1013,352)，2026-11-03 重校：旧值 (983,456) 落在卡片内打不中 X）
aliases:
- 快手极速版
behaviors:
  sign:
  - type: click_point
    x: 0.072
    y: 0.0645
    timeout: 6
    optional: false
    vision: false
    desc: 首页左上角☰打开侧边栏（2026-10-30 真机校准：旧值 0.07/0.06=(76,140) 落在图标上沿点空，实测中心 (78,151)）
  - type: think
  - type: click_point
    x: 0.638
    y: 0.161
    timeout: 8
    optional: false
    vision: false
    desc: 侧边栏「去赚钱」磁贴→任务中心（真机中心 (689,376)，2026-11-03 重校：任务中心无独立磁贴，此为去赚钱入口，点后落任务中心）
  - type: dismiss_popups
  - type: think
  - type: any_of
    optional: false
    choices:
    - - type: click_first
        candidates:
        - type: text
          value: 立即签到
        - type: desc
          value: 立即签到
        timeout: 6
        optional: false
    - - type: click_point
        x: 0.875
        y: 0.5565
        timeout: 6
        optional: false
        vision: false
        desc: 任务中心[立即签到]坐标兜底（真机中心 (945,1302)，2026-11-03 重校：直接完成签到无中间弹窗，旧值 (924,793) 落在横幅上）
  - type: reward
    pattern: 今日签到可领\s*(?P<amount>[0-9]+)\s*(?P<unit>金币)
    unit: 金币
    name: 签到金币
