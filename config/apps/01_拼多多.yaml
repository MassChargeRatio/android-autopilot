name: 拼多多
package: com.xunmeng.pinduoduo
aliases:
- 拼多多
behaviors:
  watch:
  - type: click_point
    images:
    - images/拼多多/e4417c6d-5e2a-4a24-a172-589357b264c5.png
    timeout: 6
    optional: true
    desc: 图像-拼多多-任务界面-多多视频
  collect:
  - type: click_point
    images:
    - images/拼多多/5c996370-94cc-4137-97f9-da361fd51e9b.png
    timeout: 6
    optional: true
    desc: 图像-拼多多-任务界面-余额
  withdraw:
  - type: click_point
    images:
    - images/拼多多/526d1934-9de7-4322-9f64-0834118bc519.png
    timeout: 6
    optional: true
    desc: 图像-拼多多-提现-立即提现
  sign:
  # 【用户人工描述 2026-10-20】左下数第2 tab=多多视频；其上部最右边缘圆形=签到/提现共用入口；入口任务列表没有签到就滑动；入口上部右侧=提现（暂略）
  # 注意：签到入口禁止截图 → 只用文案+归一化坐标，不用图像模板
  - type: any_of
    optional: true
    choices:
    - - type: click_first
        candidates:
        - type: text
          value: 多多视频
        candidates_from: nav_tab
        zone: tab_zone
        timeout: 8
        optional: false
    - - type: click_point
        x: 0.3
        y: 0.914
        timeout: 8
        optional: false
        vision: false
        desc: 底部左二tab「多多视频」坐标兜底
        expect:
          phash: images/拼多多/landing/ref_video.png
          phash_max_dist: 8
          retry: 1
  - type: think
  # 2026-10-23 真机重校准：圆形金币入口实测在 (0.856,0.167)。
  # 旧值 (0.93,0.12) 偏 80×110px，会静默走到错误页面（整条链后续全错）。
  # 该页无「签到」二字、可点节点仅 22 个（纯自绘），文案/节点信号全部失效，
  # 靠 dHash 落地校验兜底（同页距离 0，跨页 12~33，阈值 8 有干净间隔）。
  - type: click_point
    x: 0.902
    y: 0.16
    timeout: 6
    optional: false
    vision: false
    desc: 多多视频页右上缘圆形金币入口（2026-11-03 重校：11.11 版为浮动 HUD 徽标，实测命中点 (1043,424)/(961,330)/(918,370)，取中心 (974,374)；旧值 (924,390) 打不中）
    expect:
      phash: images/拼多多/landing/ref_coin.png
      phash_max_dist: 8
      retry: 1
      # 2026-11-01 phash落地校验族排查：金币中心页是纯自绘，但「我的现金」标签
      # 是原生节点、实证暴露在 dump 里（temp/dump_sign_text.py: ✓我的现金）。
      # 页面上部有轮播横幅/任务卡会随内容漂移（全页 dHash 10-35 假失败），
      # 语义信号与像素信号任一通过即算落地（min_pass:1），横幅漂移不再误杀。
      text_any: [我的现金]
      min_pass: 1
  # 金币中心任务列表里没有「签到」二字：签到是顶部 7 天连签条上的「今日可领」卡片，
  # 需要上滑才会露出来（旧配置 scroll_to text=签到 永远找不到，实测滚动 4 页仍无该词）。
  - type: swipe
    from: [0.5, 0.78]
    to: [0.5, 0.35]
    duration: 0.4
  - type: swipe
    from: [0.5, 0.78]
    to: [0.5, 0.35]
    duration: 0.4
  - type: click_point
    x: 0.176
    y: 0.557
    timeout: 6
    optional: false
    vision: false
    desc: 金币中心7天连签条「今日可领」卡片（2026-11-03 重校：2 次上滑后连签条第 1 天格中心 (190,1303)，旧值 (155,1182) 落在补贴金卡片上；今日已签时该格为✓）
    expect:
      phash: images/拼多多/landing/ref_sign.png
      phash_max_dist: 8
      retry: 1
  - type: click_point
    x: 0.5
    y: 0.639
    timeout: 6
    optional: false
    vision: false
    desc: 每日签到弹窗「领取今日现金」按钮（2026-11-03 重校：真机中心 (540,1496)，旧值 (540,1469) 偏上 27px）
    expect:
      phash: images/拼多多/landing/ref_done.png
      phash_max_dist: 8
