name: 点淘
package: com.taobao.live
aliases:
- 点淘
intent_map:
  collect: collect
  watch: watch
  withdraw: withdraw
behaviors:
  collect:
  - type: click_first
    candidates:
    - type: text
      value: 待领取
    - type: text
      value: 任务中心
    - type: text
      value: 天天领
    - type: text
      value: 福利
    - type: text
      value: 领奖
    timeout: 8
    optional: true
  - type: think
  - type: click_first
    candidates:
    - type: text
      value: 领取
    - type: text
      value: 领红包
    - type: text
      value: 去完成
    timeout: 6
    optional: true
  watch:
  - type: click_first
    candidates:
    - type: text
      value: 赚更多元宝
    timeout: 8
    optional: true
    desc: '点淘-watch-真机修正: 赚更多元宝->元宝中心(H5)'
  - type: think
  - type: swipe
    from:
    - 0.5
    - 0.7
    to:
    - 0.5
    - 0.3
    duration: 0.8
    natural: true
  - type: wait
    seconds: 3
  withdraw:
  - type: click_first
    candidates:
    - type: text
      value: 去兑换
    timeout: 8
    optional: true
    desc: '点淘-withdraw-真机修正: 去兑换->元宝兑权益页'
  - type: think
  - type: click_text
    text: 提现
    timeout: 6
    optional: true
  - type: reward
    pattern: (?P<amount>[0-9]+(?:\.[0-9]+)?)\s*(?P<unit>元宝)
    unit: 元宝
    name: 元宝总额
  - type: click_text
    text: 立即提现
    timeout: 6
    optional: true
