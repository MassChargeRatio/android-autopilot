name: 京东理财
package: com.jd.jrapp
aliases:
- 京东理财
- 京东金融
- 京东金
- 金融
intent_map:
  sign: sign
  collect: collect
  withdraw: withdraw
behaviors:
  sign:
  - type: click_first
    candidates:
    - type: text
      value: 签到
    - type: text
      value: 去签到
    - type: text
      value: 签到领现金
    - type: text
      value: 天天领现金
    timeout: 8
    optional: true
  - type: think
  - type: reward
    pattern: 至高\\s*¥(?P<amount>[0-9]+(?:\\.[0-9]+)?)
    unit: 元
    name: 签到现金
  - type: click_first
    candidates:
    - type: text
      value: 签到领现金
    - type: text
      value: 去签到
    - type: text
      value: 立即签到
    timeout: 6
    optional: true
  - type: swipe
    from:
    - 0.5
    - 0.7
    to:
    - 0.5
    - 0.3
    duration: 0.8
    natural: true
  - type: wait
    seconds: 2
  collect:
  - type: click_first
    candidates:
    - type: text
      value: 领现金
    - type: text
      value: 天天领现金
    - type: text
      value: 任务中心
    - type: text
      value: 领3.88元
    timeout: 8
    optional: true
  - type: think
  - type: click_first
    candidates:
    - type: text
      value: 领取
    - type: text
      value: 立即领取
    - type: text
      value: 去完成
    timeout: 6
    optional: true
  - type: swipe
    from:
    - 0.5
    - 0.7
    to:
    - 0.5
    - 0.3
    duration: 0.8
    natural: true
  - type: wait
    seconds: 2
  withdraw:
  - type: click_text
    text: 我的
    timeout: 6
    optional: true
  - type: think
  - type: click_text
    text: 提现
    timeout: 6
    optional: true
  - type: reward
    pattern: 可提现(?P<amount>[0-9]+(?:\\.[0-9]+)?)\\s*(?P<unit>元)
    unit: 元
    name: 可提现余额
  - type: click_text
    text: 立即提现
    timeout: 6
    optional: true
