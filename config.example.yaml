# ============================================================
# config.example.yaml — 配置模板（可安全提交）
#
# 用法：复制成 config.yaml 再填自己的值。config.yaml 已在 .gitignore 里，
#       因为 vision.vlm.api_key 是真实密钥。
#       Key 也可以用环境变量 VLM_KEY 提供（优先级高于本文件）。
# 提交前自查：python devtools/check_secrets.py --staged
# ============================================================

device:
  serial: '192.168.1.100:5555'   # 改成你的设备
  screen_w: 1080
  screen_h: 2340
human:
  enabled: true
  wake_window:
    start: 07:30
    end: '23:00'
  run_jitter_seconds:
  - 0
  - 600
  delay_between_actions:
  - 0.6
  - 2.2
  delay_after_open:
  - 3.0
  - 6.0
  think_delay:
  - 1.5
  - 4.0
  swipe_duration:
  - 0.5
  - 0.9
  tap_jitter_px: 12
  wander_probability: 0.06
  scroll_probability: 0.5
  use_swipe_home: false
trajectory:
  enabled: true
  px_per_step: 15
  steps_min: 20
  steps_max: 60
  duration_per_px: 0.0007
  duration_min: 0.3
  duration_max: 1.5
  perpendicular_ratio: 0.12
  use_ease_in_out: true
  jitter_sigma: 1.2
  jitter_tail_fraction: 0.25
  overshoot_prob: 0.25
  overshoot_ratio: 0.06
vision:
  enabled: true
  template_dir: templates
  template_threshold: 0.8
  template_scales:
  - 0.6
  - 0.8
  - 1.0
  - 1.2
  - 1.4
  min_score: 0.5
  vlm:
    enabled: true
    base_url: http://localhost:20128/v1
    api_key: YOUR_VLM_API_KEY_HERE
    model: auto/best-vision
    timeout: 90
    # 坐标空间：norm1000 = 模型返回 0-1000 归一化坐标（本网关实测为默认行为，
    # 明确要求并换算后误差可到 ~1px）；pixel = 模型直接返回像素坐标。
    coord_space: norm1000
    # 每个后端重试次数。网关偶发返回内容安全串（"User Safety: safe"）而非 JSON，
    # 重试可显著提升可用率。
    attempts: 3
    fallback:
      base_url: http://localhost:20128/v1
      api_key: YOUR_VLM_API_KEY_HERE
      model: auto/vision
      timeout: 90
knowledge:
  file: element_knowledge.yaml
  fail_threshold: 3
diversify:
  variant_prob: 0.8
captcha:
  enabled: false
  slider:
    detect_texts:
    - 按住滑块
    - 拖动滑块
    - 向右滑动
    - 拖动到最右边
    - 向右拖动滑块
    success_texts:
    - 验证成功
    - 验证通过
    - 验证完成
    - 拼图完成
    retry_times: 3
    handle_y_ratio: 0.85
    handle_x_ratio: 0.08
    handle_templates: []
    band_h_ratio: 0.08
    scale: 1.0
    gap:
      mode: edge
      diff_threshold: 60
      background_template: ''
      vlm_prompt: 图片中有滑块验证码，缺口（暗色凹槽）中心的 x 坐标是多少？只返回数字。
    drag:
      duration:
      - 0.9
      - 1.5
apps:
- name: 趣头条
  package: com.jifen.qukan
  aliases:
  - 趣头条
  - 趣看天下
  - 趣闻
  - 新闻赚金币
  intent_map:
    sign: sign
    watch: watch
    withdraw: withdraw
  behaviors:
    sign:
    - type: click_first
      candidates:
      - type: text
        value: 直接签到
      - type: text
        value: 每日签到
      - type: text
        value: 签到
      - type: text
        value: 立即签到
      timeout: 8
      optional: true
    - type: think
    - type: reward
      pattern: 已连续签到(?P<amount>[0-9]+)\s*(?P<unit>天)
      unit: 天
      name: 连续签到天数
    - type: reward
      pattern: 明日签到可领(?P<amount>[0-9]+)\s*(?P<unit>金币)
      unit: 金币
      name: 明日签到奖励
    - type: reward
      pattern: 看视频再领(?P<amount>[0-9]+)\s*(?P<unit>金币)
      unit: 金币
      name: 视频额外奖励
    - type: click_id
      res_id: com.jifen.qukan:id/iv_close
      optional: true
    watch:
    - type: click_first
      candidates:
      - type: text
        value: 看视频领金币
      - type: text
        value: 体验领金币
      - type: text
        value: 领50金币
      - type: text
        value: 视频
      timeout: 8
      optional: true
    - type: think
    - type: reward
      pattern: 看视频[^0-9]*(?P<amount>[0-9]+)\s*(?P<unit>金币)
      unit: 金币
      name: 看视频
    - type: reward
      pattern: \+\s*(?P<amount>[0-9]+)\s*(?P<unit>金币)
      unit: 金币
      name: 看视频加奖
    - type: swipe
      from:
      - 0.5
      - 0.7
      to:
      - 0.5
      - 0.3
      duration: 0.8
      natural: true
    - type: wait
      seconds: 3
    withdraw:
    - type: click_text
      text: 我的
      timeout: 8
    - type: think
    - type: click_text
      text: 提现兑换
      timeout: 6
    - type: ensure
      text: 我要提现
      exists: 'yes'
      timeout: 5
    - type: reward
      pattern: 约(?P<amount>[0-9]+(?:\.[0-9]+)?)\s*(?P<unit>元)
      unit: 元
      name: 可提现余额
    - type: click_text
      text: 立即提现
      timeout: 6
      optional: true
